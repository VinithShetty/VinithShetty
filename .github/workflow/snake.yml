name: Generate Snake Animation

on:
  # Re-generate the snake once a day (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Let you trigger it manually from the Actions tab
  workflow_dispatch:
  # Also run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Allow the built-in token to push the generated SVG to the output branch
    permissions:
      contents: write
    steps:
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.5.0
        with:
          # Reads the contribution graph of whoever owns this repo
          github_user_name: ${{ github.repository_owner }}
          # One file per line; the dark variant uses the github-dark palette
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes everything in dist/ to a branch named "output"
      - name: push-snake-to-output-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
